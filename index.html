<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>량원펑 신격화 게이지 — 병맛 소형판</title>
<meta name="description" content="량붕이부터 킹갓평까지, 31단계로 보는 량원펑 신격화 게이지">
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;overflow:hidden}
body{display:flex;justify-content:center;background:transparent}
.widget{--accent:#ffcd61;--paper:#2a231c;--edge:#846239;width:100%;max-width:440px;height:440px;padding:6px;display:grid;grid-template-rows:minmax(0,1fr) 42px;gap:6px;overflow:hidden;border:1px solid var(--edge);border-radius:12px;background:#231f1b}
.widget[data-stage="0"]{--accent:#bd3858;--paper:#fff0f2;--edge:#e5adb9}
.widget[data-stage="1"]{--accent:#ae563e;--paper:#fff2eb;--edge:#e4b5a3}
.widget[data-stage="2"]{--accent:#6c7777;--paper:#f3f5f2;--edge:#b8c4bf}
.widget[data-stage="3"]{--accent:#237d73;--paper:#eaf9f3;--edge:#92c6b9}
.widget[data-stage="4"]{--accent:#8453bb;--paper:#f3edff;--edge:#c5a9e9}
.center{display:flex;min-width:0;min-height:0;overflow:hidden}
.portrait{position:relative;width:100%;height:100%;overflow:hidden;border-radius:8px;background:#333}
.fallback{position:absolute;inset:0;display:grid;place-items:center;font:bold 70px Georgia,serif;color:#828c84}
.portrait img,.portrait video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.portrait img.failed{opacity:0}
.portrait video{opacity:0;pointer-events:none}.portrait video.active{opacity:1}
.controls{display:flex;align-items:center;min-width:0}
.range{appearance:none;display:block;width:100%;height:34px;margin:0;padding:0;background:transparent;cursor:pointer;touch-action:pan-y}
.range::-webkit-slider-runnable-track{height:14px;border-radius:10px;background:linear-gradient(90deg,#d24e6c,#a6ada9,#f2b844)}
.range::-webkit-slider-thumb{appearance:none;width:30px;height:30px;margin-top:-8px;background:var(--paper);border:3px solid var(--accent);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.range::-moz-range-track{height:14px;border-radius:10px;background:linear-gradient(90deg,#d24e6c,#a6ada9,#f2b844)}
.range::-moz-range-thumb{width:26px;height:26px;background:var(--paper);border:3px solid var(--accent);border-radius:50%}
.range:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<main class="widget" id="widget" data-stage="5" aria-label="량원펑 신격화 게이지">
  <section class="center" aria-label="현재 량원펑 등급">
    <div class="portrait">
      <span class="fallback" aria-hidden="true">梁</span>
      <img id="portrait" src="https://lichtspektrum.github.io/liang-intensity-calibrator/frames/frame-30.webp" alt="량원펑 단계별 밈 초상" decoding="async">
      <video id="video" muted playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
    </div>
  </section>
  <footer class="controls">
    <input class="range" id="strength" type="range" min="-15" max="15" step="1" value="15"
      aria-label="량원펑 신격화 정도, 왼쪽은 대참사 오른쪽은 신격화">
  </footer>
</main>
<script>
(() => {
  "use strict";
  // Reimplemented from MIT-licensed Lichtspektrum/liang-intensity-calibrator.
  // Original portrait/video media are separately licensed and are NOT bundled.
  const ROOT = "https://lichtspektrum.github.io/liang-intensity-calibrator/";
  const TIERS = [
    {name:"량붕이",emoji:"😭",line:"대체 신모델 언제나옴?"},
    {name:"량통수",emoji:"😤",line:"이걸 신모델이라고 내놓음?"},
    {name:"량원펑",emoji:"🤔",line:"일단 중립기어 박아봄"},
    {name:"대원평",emoji:"🙇",line:"명불허전이죠? 대가리 다 봉합됐죠?"},
    {name:"갓원평",emoji:"🔥",line:"그저 GOAT"},
    {name:"킹갓평",emoji:"👑",line:"예수, 왜 회의를 시작하지 않는거지?\n\n아직 량원펑이 오지 않았다네."}
  ];
  const $ = id => document.getElementById(id);
  const widget=$("widget"), input=$("strength");
  const image=$("portrait"), video=$("video");
  const clamp=n => Math.min(15, Math.max(-15, Math.round(n)));
  const params = new URLSearchParams(location.search);
  const parsed = Number(params.get("score"));
  let current = params.has("score") && Number.isFinite(parsed) ? clamp(parsed) : 15;
  let lastFrame = -1;
  let videoReady = false, seeking = false, targetTime = null, scheduled = 0;

  function frameUrl(frame){
    return ROOT + "frames/frame-" + String(frame).padStart(2,"0") + ".webp";
  }
  function update(value){
    current = clamp(value);
    const frame = current + 15;
    const tierIndex = Math.min(5, Math.floor(frame/6));
    const tier = TIERS[tierIndex];
    widget.dataset.stage = String(tierIndex);
    input.value = String(current);
    input.setAttribute("aria-valuetext", tier.name + ", " + current + "점. " + tier.line);
    if(frame !== lastFrame){
      lastFrame = frame;
      image.classList.remove("failed");
      image.src = frameUrl(frame);
      image.alt = tier.name + ", " + (frame+1) + "번째 초상";
    }
    if(videoReady){
      targetTime = (frame / 30) * Math.max(0, video.duration - 1/30);
      video.classList.remove("active");
      if(!scheduled) scheduled = requestAnimationFrame(seekToLatest);
    }
  }
  function seekToLatest(){
    scheduled = 0;
    if(!videoReady || seeking || targetTime === null) return;
    if(Math.abs(video.currentTime - targetTime) < .001){
      if(video.readyState >= 2) video.classList.add("active");
      targetTime = null; return;
    }
    seeking = true;
    try {video.currentTime = targetTime;} catch(e){seeking=false;targetTime=null;}
  }
  image.addEventListener("error", () => image.classList.add("failed"));
  video.addEventListener("loadedmetadata", () => {
    if(!(video.duration>0)) return;
    videoReady=true;
    targetTime=((current+15)/30)*Math.max(0,video.duration-1/30);
    if(!scheduled) scheduled=requestAnimationFrame(seekToLatest);
  });
  video.addEventListener("seeked", () => {
    seeking=false;
    if(targetTime === null) return;
    if(Math.abs(video.currentTime - targetTime)<.06){
      video.classList.add("active"); targetTime=null;
    }else if(!scheduled) scheduled=requestAnimationFrame(seekToLatest);
  });
  video.addEventListener("error",()=>{videoReady=false;video.classList.remove("active")});
  input.addEventListener("input",()=>update(Number(input.value)));
  update(current);

  // Default: lightweight 31 still frames. Add ?smooth=1 for original continuous video.
  if(params.get("smooth")==="1"){
    const webm=document.createElement("source");
    webm.src=ROOT+"video/liang-evolution.webm";
    webm.type='video/webm; codecs="vp9"';
    const mp4=document.createElement("source");
    mp4.src=ROOT+"video/liang-evolution.mp4";
    mp4.type='video/mp4; codecs="avc1.64001f"';
    video.append(webm,mp4);
    video.load();
  }
})();
</script>
</body>
</html>
